# Deploys only after CI passes on main.
# Placeholder: fill in once you pick a host (Fly.io, Railway, etc). See docs/FIRST-SESSION.md, step 10.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Replace this step with your host's deploy command (e.g. flyctl deploy --remote-only)"
